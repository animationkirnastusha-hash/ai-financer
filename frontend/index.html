<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      window.__AI_FINANCER_INIT_TELEGRAM_ANALYTICS__ = function () {
        var token = '%VITE_TELEGRAM_ANALYTICS_TOKEN%'.trim();
        var appName = ('%VITE_TELEGRAM_ANALYTICS_IDENTIFIER%'.trim() || 'ai_financer');

        if (!token || token.indexOf('%VITE_') === 0) return;
        if (!window.telegramAnalytics || typeof window.telegramAnalytics.init !== 'function') return;
        if (window.__AI_FINANCER_TELEGRAM_ANALYTICS_READY__) return;

        window.telegramAnalytics.init({
          token: token,
          appName: appName,
        });
        window.__AI_FINANCER_TELEGRAM_ANALYTICS_READY__ = true;
      };
    </script>
    <script
      src="https://tganalytics.xyz/index.js"
      onload="window.__AI_FINANCER_INIT_TELEGRAM_ANALYTICS__ && window.__AI_FINANCER_INIT_TELEGRAM_ANALYTICS__()"
      type="text/javascript"
    ></script>

    <title>AI-financer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
